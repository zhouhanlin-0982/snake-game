<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Snake · 贪吃蛇</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #07080c;
      --bg1: #0d0f14;
      --glass: rgba(255, 255, 255, 0.045);
      --glass-b: rgba(255, 255, 255, 0.09);
      --text: #f4f6fa;
      --muted: #8b919d;
      --accent: #a78bfa;
      --accent2: #34d399;
      --danger: #fb7185;
      --canvas-bg: #0c0e14;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      --radius: 20px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: "Outfit", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      touch-action: manipulation;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(167, 139, 250, 0.14), transparent 55%),
        radial-gradient(900px 500px at 95% 10%, rgba(52, 211, 153, 0.1), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
      color: var(--text);
      min-height: 100%;
      padding: clamp(1rem, 3vw, 2rem);
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr minmax(260px, 320px);
      gap: clamp(1rem, 2vw, 1.75rem);
      align-items: start;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.25rem;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .brand h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      font-weight: 400;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      border-radius: 999px;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 500;
    }
    .pill strong {
      color: var(--text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 12px var(--accent2);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 999px;
      padding: 0.55rem 1.15rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #c4b5fd, var(--accent));
      color: #12081f;
      box-shadow: 0 12px 28px rgba(167, 139, 250, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 14px 36px rgba(167, 139, 250, 0.45);
    }
    .btn-ghost {
      background: var(--glass);
      color: var(--text);
      border: 1px solid var(--glass-b);
    }
    .btn-ghost:hover { border-color: rgba(255, 255, 255, 0.22); }

    .game-card {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: clamp(1rem, 2vw, 1.35rem);
      position: relative;
      overflow: hidden;
    }
    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(600px 240px at 20% 0%, rgba(167, 139, 250, 0.08), transparent 60%);
      pointer-events: none;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: min(100vw - 2rem, 460px);
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      border-radius: calc(var(--radius-sm) + 6px);
      overflow: hidden;
      border: 1px solid rgba(167, 139, 250, 0.22);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 0 1px rgba(0, 0, 0, 0.35),
        0 20px 50px rgba(0, 0, 0, 0.45),
        0 0 60px rgba(167, 139, 250, 0.12);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .canvas-wrap.boost-hold::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 40px rgba(52, 211, 153, 0.25);
      border-radius: inherit;
      animation: boostPulse 0.9s ease-in-out infinite;
    }
    @keyframes boostPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--canvas-bg);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      text-align: center;
      background: rgba(7, 8, 12, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .overlay.visible { display: flex; }
    .overlay h2 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .overlay .sub {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      max-width: 280px;
    }
    .overlay-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }
    .overlay-page { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; }
    .overlay-page[hidden] { display: none !important; }
    .diff-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      width: min(280px, 100%);
      margin-top: 0.25rem;
    }
    .diff-grid button {
      width: 100%;
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
    }
    .diff-grid button[data-diff="easy"] {
      background: linear-gradient(135deg, #6ee7b7, #34d399);
      color: #052e1f;
    }
    .diff-grid button[data-diff="normal"] {
      background: linear-gradient(135deg, #c4b5fd, var(--accent));
      color: #12081f;
    }
    .diff-grid button[data-diff="hard"] {
      background: linear-gradient(135deg, #fda4af, #fb7185);
      color: #3f0d16;
    }
    .name-row {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 1rem;
      width: min(280px, 100%);
      text-align: left;
    }
    .name-row label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 600;
    }
    .name-row input {
      width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-b);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      padding: 0.65rem 0.85rem;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .name-row input:focus {
      border-color: rgba(167, 139, 250, 0.55);
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 1.15rem 1.2rem;
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    .panel-head h3 {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .panel-head span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .lb-table th {
      text-align: left;
      font-weight: 500;
      color: var(--muted);
      padding: 0.35rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .lb-table td {
      padding: 0.55rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-variant-numeric: tabular-nums;
    }
    .lb-table tr:last-child td { border-bottom: none; }
    .rank {
      width: 2rem;
      color: var(--muted);
      font-weight: 500;
    }
    .rank.top { color: var(--accent2); }
    .player { font-weight: 500; }
    .pts { text-align: right; font-weight: 600; color: var(--text); }
    .lb-empty {
      margin: 0;
      padding: 1.25rem 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .controls-hint {
      margin: 1rem 0 0;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.55;
      text-align: center;
      letter-spacing: 0.03em;
    }
    .kbd {
      display: inline-block;
      padding: 0.12rem 0.45rem;
      border-radius: 6px;
      border: 1px solid var(--glass-b);
      background: rgba(0, 0, 0, 0.25);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text);
      margin: 0 0.1rem;
    }

    .touch-pad {
      display: none;
      margin-top: 1rem;
      padding-bottom: max(0.35rem, env(safe-area-inset-bottom, 0px));
      max-width: min(280px, 100%);
      margin-left: auto;
      margin-right: auto;
      gap: 0.35rem;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      align-items: stretch;
      justify-items: stretch;
    }
    .touch-btn {
      min-height: 48px;
      border-radius: var(--radius-sm);
      background: var(--glass);
      border: 1px solid var(--glass-b);
      color: var(--text);
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }
    .touch-btn:active { transform: scale(0.97); }
    .touch-btn.touch-primary {
      background: linear-gradient(135deg, #c4b5fd, var(--accent));
      color: #12081f;
      border: none;
      font-size: 0.82rem;
    }
    .touch-up { grid-column: 2; grid-row: 1; }
    .touch-left { grid-column: 1; grid-row: 2; }
    .touch-pause { grid-column: 2; grid-row: 2; }
    .touch-right { grid-column: 3; grid-row: 2; }
    .touch-down { grid-column: 2; grid-row: 3; }

    @media (pointer: coarse), (max-width: 720px) {
      .touch-pad { display: grid; }
    }
    .touch-pad.show-always { display: grid; }
    .pill .diff-label { color: var(--accent2); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <h1>贪吃蛇</h1>
        <p>霓虹画布 · 三控操作 · 粒子爆发 · 本地纪录</p>
      </div>
      <div class="toolbar">
        <div class="pill"><span class="dot" aria-hidden="true"></span>得分 <strong id="score">0</strong></div>
        <div class="pill">纪录 <strong id="best">0</strong></div>
        <div class="pill" id="pillDifficulty" hidden>难度 <strong class="diff-label" id="diffLabel">—</strong></div>
        <button type="button" class="btn-ghost" id="btnPause">暂停</button>
        <button type="button" class="btn-ghost" id="btnSound" aria-pressed="false">音效：开</button>
        <button type="button" class="btn-primary" id="btnRestart">重新开始</button>
      </div>
    </header>

    <div class="game-card">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="game" width="360" height="360" aria-label="贪吃蛇游戏画布"></canvas>
        <div class="overlay visible" id="overlay" role="dialog" aria-modal="true" aria-labelledby="diffTitle">
          <div class="overlay-page" id="pageDifficulty">
            <h2 id="diffTitle">选择难度</h2>
            <p class="sub">简单节奏最慢，困难节奏最快；可随时用「重新开始」重开一局</p>
            <div class="diff-grid">
              <button type="button" class="btn-primary" data-diff="easy" id="btnDiffEasy">简单</button>
              <button type="button" class="btn-primary" data-diff="normal" id="btnDiffNormal">普通</button>
              <button type="button" class="btn-primary" data-diff="hard" id="btnDiffHard">困难</button>
            </div>
          </div>
          <div class="overlay-page" id="pageStandard" hidden>
            <h2 id="overlayTitle">暂停</h2>
            <p class="sub" id="overlayMsg">点击继续或按 P</p>
            <div class="overlay-actions" id="overlayDefaultActions">
              <button type="button" class="btn-primary" id="btnOverlay">继续</button>
            </div>
          </div>
          <div class="overlay-page" id="overlayGameOver" hidden>
            <h2 id="overlayTitleGo" style="margin:0 0 0.35rem;font-size:1.35rem;font-weight:600;">游戏结束</h2>
            <p class="sub" id="goScoreLine"></p>
            <div class="name-row">
              <label for="playerName">昵称（上榜用）</label>
              <input id="playerName" type="text" maxlength="12" placeholder="例如 Nova" autocomplete="off" enterkeyhint="done" />
            </div>
            <div class="overlay-actions">
              <button type="button" class="btn-primary" id="btnSaveLb">保存成绩</button>
              <button type="button" class="btn-ghost" id="btnSkipLb">跳过</button>
            </div>
          </div>
        </div>
      </div>
      <div class="touch-pad" id="touchPad" aria-label="方向与暂停">
        <button type="button" class="touch-btn touch-up" id="touchUp" aria-label="向上">↑</button>
        <button type="button" class="touch-btn touch-left" id="touchLeft" aria-label="向左">←</button>
        <button type="button" class="touch-btn touch-primary touch-pause" id="touchPause" aria-label="暂停或继续">暂停</button>
        <button type="button" class="touch-btn touch-right" id="touchRight" aria-label="向右">→</button>
        <button type="button" class="touch-btn touch-down" id="touchDown" aria-label="向下">↓</button>
      </div>
      <p class="controls-hint" id="controlsHint">
        键盘 <span class="kbd">↑↓←→</span> / <span class="kbd">WASD</span>
        · 画布上滑动转向
        · <span class="kbd">Space</span> 按住加速
        · <span class="kbd">P</span> 暂停 · <span class="kbd">Esc</span> 暂停 · <span class="kbd">R</span> 重开
        <span id="controlsHintTouch" hidden><br />触控：虚拟方向键 + 在画面上滑动；按住画面加速</span>
      </p>
    </div>

    <aside class="side">
      <div class="panel">
        <div class="panel-head">
          <h3>排行榜</h3>
          <span>TOP 10 · 本机</span>
        </div>
        <table class="lb-table" id="lbTable" aria-label="本地排行榜">
          <thead>
            <tr><th>#</th><th>玩家</th><th style="text-align:right">分数</th></tr>
          </thead>
          <tbody id="lbBody"></tbody>
        </table>
        <p class="lb-empty" id="lbEmpty" style="display:none;">暂无记录<br />结束一局即可上榜</p>
      </div>
    </aside>
  </div>

  <script>
(function () {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvasWrap");

  /** 逻辑坐标边长（正方形），随容器宽度自适应 */
  const COLS = 20;
  const ROWS = 20;
  let LOGICAL = 360;
  let CELL = LOGICAL / COLS;

  /** 按住加速时 tick 乘数（越小越快） */
  const BOOST_TICK_MUL = 0.52;
  /** 滑动最小像素位移（逻辑坐标近似：用 CSS 像素 / dpr 折算到逻辑边） */
  const SWIPE_MIN_PX = 28;

  let boostKey = false;
  let boostPointer = false;
  /** @type {number | null} */
  let swipePointerId = null;
  let swipeStartX = 0;
  let swipeStartY = 0;

  function isBoosting() {
    return (boostKey || boostPointer) && running && !paused && !gameOver && difficultyChosen;
  }

  function syncBoostUi() {
    canvasWrap.classList.toggle("boost-hold", isBoosting());
  }

  /** @type {{ x: number, y: number, vx: number, vy: number, life: number, rgb: string }[]} */
  let particles = [];

  function applyCanvasResolution() {
    const rect = canvasWrap.getBoundingClientRect();
    let w = Math.floor(rect.width);
    if (!w || w < 200) w = 280;
    w = Math.min(w, 560);
    LOGICAL = w;
    CELL = LOGICAL / COLS;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(LOGICAL * dpr);
    canvas.height = Math.round(LOGICAL * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  applyCanvasResolution();
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayMsg = document.getElementById("overlayMsg");
  const overlayDefaultActions = document.getElementById("overlayDefaultActions");
  const btnOverlay = document.getElementById("btnOverlay");
  const btnRestart = document.getElementById("btnRestart");
  const btnPause = document.getElementById("btnPause");
  const btnSound = document.getElementById("btnSound");
  const pageDifficulty = document.getElementById("pageDifficulty");
  const pageStandard = document.getElementById("pageStandard");
  const pillDifficulty = document.getElementById("pillDifficulty");
  const diffLabel = document.getElementById("diffLabel");
  const controlsHintTouch = document.getElementById("controlsHintTouch");
  const touchUp = document.getElementById("touchUp");
  const touchDown = document.getElementById("touchDown");
  const touchLeft = document.getElementById("touchLeft");
  const touchRight = document.getElementById("touchRight");
  const touchPause = document.getElementById("touchPause");
  const lbBody = document.getElementById("lbBody");
  const lbEmpty = document.getElementById("lbEmpty");
  const lbTable = document.getElementById("lbTable");
  const overlayGameOver = document.getElementById("overlayGameOver");
  const goScoreLine = document.getElementById("goScoreLine");
  const playerName = document.getElementById("playerName");
  const btnSaveLb = document.getElementById("btnSaveLb");
  const btnSkipLb = document.getElementById("btnSkipLb");

  /** 固定障碍（避开初始蛇身 6–8,10） */
  const FIXED_OBSTACLES = [
    { x: 5, y: 5 },
    { x: 5, y: 6 },
    { x: 6, y: 5 },
    { x: 14, y: 14 },
    { x: 14, y: 15 },
    { x: 15, y: 14 },
    { x: 10, y: 3 },
    { x: 10, y: 4 },
    { x: 9, y: 16 },
    { x: 10, y: 16 },
  ];
  const fixedObstacleSet = new Set(FIXED_OBSTACLES.map((o) => o.x + "," + o.y));

  const BEST_KEY = "snake-best-score";
  const LB_KEY = "snake-leaderboard-v2";
  const MUTE_KEY = "snake-sound-muted";

  /** 初始间隔 ms（越小越快）、最快速度下限、每吃一个加快的步长 */
  const DIFF = {
    easy: { start: 200, min: 105, step: 1 },
    normal: { start: 130, min: 72, step: 2 },
    hard: { start: 82, min: 42, step: 3 },
  };
  const DIFF_NAMES = { easy: "简单", normal: "普通", hard: "困难" };

  let snake, dir, nextDir, food, score, tickMs, lastTick;
  let running, paused, gameOver;
  let difficultyChosen = false;
  let currentDifficulty = "normal";
  let soundMuted = localStorage.getItem(MUTE_KEY) === "1";
  let audioCtx = null;
  let pendingLbScore = null;

  let obstacleIntervalId = null;
  /** @type {{ x: number, y: number, until: number } | null} */
  let tempObstacle = null;
  let pauseObstacleAnchor = null;

  function stopObstacleSpawner() {
    if (obstacleIntervalId != null) {
      clearInterval(obstacleIntervalId);
      obstacleIntervalId = null;
    }
    tempObstacle = null;
    pauseObstacleAnchor = null;
  }

  function startObstacleSpawner() {
    stopObstacleSpawner();
    obstacleIntervalId = setInterval(spawnTempObstacle, 5000);
  }

  function notePauseForObstacles() {
    pauseObstacleAnchor = performance.now();
  }

  function resumeObstacleAfterPause() {
    if (pauseObstacleAnchor == null) return;
    const dt = performance.now() - pauseObstacleAnchor;
    if (tempObstacle) tempObstacle.until += dt;
    pauseObstacleAnchor = null;
  }

  function spawnTempObstacle() {
    if (!running || paused || gameOver || !difficultyChosen) return;
    const occ = new Set();
    for (const s of snake) occ.add(s.x + "," + s.y);
    occ.add(food.x + "," + food.y);
    for (const k of fixedObstacleSet) occ.add(k);
    if (tempObstacle) occ.add(tempObstacle.x + "," + tempObstacle.y);
    const free = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        const key = x + "," + y;
        if (!occ.has(key)) free.push({ x, y });
      }
    }
    if (!free.length) return;
    const pick = free[randInt(free.length)];
    tempObstacle = { x: pick.x, y: pick.y, until: performance.now() + 3000 };
  }

  function tempObstacleActive() {
    if (!tempObstacle) return false;
    if (paused) return true;
    return performance.now() < tempObstacle.until;
  }

  function blockedByObstacle(nh) {
    if (fixedObstacleSet.has(nh.x + "," + nh.y)) return true;
    if (tempObstacle && performance.now() < tempObstacle.until && nh.x === tempObstacle.x && nh.y === tempObstacle.y) return true;
    return false;
  }

  function syncSoundButton() {
    btnSound.textContent = soundMuted ? "音效：关" : "音效：开";
    btnSound.setAttribute("aria-pressed", soundMuted ? "true" : "false");
  }

  function getAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    return audioCtx;
  }

  function resumeAudio() {
    const ctx = getAudio();
    if (ctx && ctx.state === "suspended") ctx.resume().catch(() => {});
  }

  function playTone(freq, dur, vol, type) {
    if (soundMuted) return;
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function sfxEat() {
    resumeAudio();
    playTone(520, 0.05, 0.06, "triangle");
    setTimeout(() => playTone(784, 0.07, 0.06, "triangle"), 45);
  }

  function sfxDie() {
    resumeAudio();
    playTone(185, 0.12, 0.09, "sawtooth");
    setTimeout(() => playTone(95, 0.22, 0.1, "sawtooth"), 90);
  }

  function sfxPause() {
    resumeAudio();
    playTone(330, 0.06, 0.04, "sine");
  }

  function sfxStart() {
    resumeAudio();
    playTone(440, 0.06, 0.045, "sine");
    setTimeout(() => playTone(554, 0.08, 0.045, "sine"), 70);
  }

  function loadLeaderboard() {
    try {
      const raw = localStorage.getItem(LB_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch {
      return [];
    }
  }

  function saveLeaderboard(rows) {
    localStorage.setItem(LB_KEY, JSON.stringify(rows.slice(0, 10)));
  }

  function renderLeaderboard() {
    const rows = loadLeaderboard()
      .filter((r) => r && typeof r.score === "number")
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);

    lbBody.textContent = "";
    if (!rows.length) {
      lbTable.style.display = "none";
      lbEmpty.style.display = "block";
      return;
    }
    lbTable.style.display = "table";
    lbEmpty.style.display = "none";

    rows.forEach((r, i) => {
      const tr = document.createElement("tr");
      const rankTd = document.createElement("td");
      rankTd.className = "rank" + (i < 3 ? " top" : "");
      rankTd.textContent = String(i + 1);
      const nameTd = document.createElement("td");
      nameTd.className = "player";
      nameTd.textContent = String(r.name || "匿名").slice(0, 12);
      const scTd = document.createElement("td");
      scTd.className = "pts";
      scTd.textContent = String(r.score);
      tr.append(rankTd, nameTd, scTd);
      lbBody.appendChild(tr);
    });
  }

  function loadBest() {
    const v = parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
    bestEl.textContent = Number.isFinite(v) ? v : 0;
  }

  function saveBest() {
    const best = parseInt(bestEl.textContent, 10) || 0;
    if (score > best) {
      bestEl.textContent = String(score);
      localStorage.setItem(BEST_KEY, String(score));
    }
  }

  function randInt(n) {
    return Math.floor(Math.random() * n);
  }

  function spawnEatParticles(cx, cy) {
    const n = 22 + randInt(14);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = LOGICAL * 0.0055 * (1.1 + Math.random() * 2.4);
      const roll = Math.random();
      const rgb = roll < 0.38 ? "167,139,250" : roll < 0.72 ? "52,211,153" : "251,113,133";
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        rgb,
      });
    }
  }

  function stepParticles(dt) {
    if (!particles.length) return;
    const decay = dt * 0.0011;
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.965;
      p.vy *= 0.965;
      p.life -= decay;
    }
    particles = particles.filter((p) => p.life > 0.03);
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      const rad = CELL * 0.14 * Math.sqrt(p.life);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 4);
      g.addColorStop(0, `rgba(${p.rgb},${0.7 * p.life})`);
      g.addColorStop(0.35, `rgba(${p.rgb},${0.35 * p.life})`);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad * 4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function emptyCell() {
    const occupied = new Set(snake.map((s) => s.x + "," + s.y));
    for (const k of fixedObstacleSet) occupied.add(k);
    if (tempObstacleActive()) occupied.add(tempObstacle.x + "," + tempObstacle.y);
    let x, y, guard = 0;
    do {
      x = randInt(COLS);
      y = randInt(ROWS);
      guard++;
    } while (occupied.has(x + "," + y) && guard < COLS * ROWS * 3);
    return { x, y };
  }

  function showPageDifficulty() {
    pageDifficulty.hidden = false;
    pageStandard.hidden = true;
    overlayGameOver.hidden = true;
    overlay.classList.add("visible");
  }

  function showOverlay(title, msg) {
    overlayTitle.textContent = title;
    overlayMsg.textContent = msg;
    btnOverlay.style.display = "inline-flex";
    pageDifficulty.hidden = true;
    overlayGameOver.hidden = true;
    pageStandard.hidden = false;
    overlay.classList.add("visible");
  }

  function showGameOverPage() {
    pageDifficulty.hidden = true;
    pageStandard.hidden = true;
    overlayGameOver.hidden = false;
    overlay.classList.add("visible");
  }

  function hideOverlay() {
    overlay.classList.remove("visible");
    pageDifficulty.hidden = true;
    pageStandard.hidden = true;
    overlayGameOver.hidden = true;
    overlayMsg.style.display = "block";
    overlayDefaultActions.style.display = "flex";
    pendingLbScore = null;
  }

  function tickCfg() {
    return DIFF[currentDifficulty] || DIFF.normal;
  }

  function syncPauseLabels() {
    const t = paused ? "继续" : "暂停";
    btnPause.textContent = t;
    touchPause.textContent = t;
    touchPause.setAttribute("aria-label", paused ? "继续游戏" : "暂停游戏");
  }

  function syncTouchHint() {
    const mq = window.matchMedia("(pointer: coarse), (max-width: 720px)");
    controlsHintTouch.hidden = !mq.matches;
  }

  function openGameOver(reason) {
    stopObstacleSpawner();
    boostKey = false;
    boostPointer = false;
    if (swipePointerId != null) {
      try {
        canvasWrap.releasePointerCapture(swipePointerId);
      } catch (_) {}
      swipePointerId = null;
    }
    syncBoostUi();
    saveBest();
    sfxDie();
    pendingLbScore = score;
    goScoreLine.textContent = reason + " · 本局 " + score + " 分";
    playerName.value = localStorage.getItem("snake-last-name") || "";
    showGameOverPage();
    syncPauseLabels();
    try {
      playerName.focus({ preventScroll: true });
    } catch {
      playerName.focus();
    }
  }

  function submitLeaderboard() {
    if (pendingLbScore == null) return;
    const name = (playerName.value || "匿名").trim() || "匿名";
    localStorage.setItem("snake-last-name", name.slice(0, 12));
    const row = { name: name.slice(0, 12), score: pendingLbScore, ts: Date.now() };
    const rows = loadLeaderboard();
    rows.push(row);
    rows.sort((a, b) => b.score - a.score);
    saveLeaderboard(rows);
    renderLeaderboard();
    pendingLbScore = null;
    resetGame();
  }

  function skipLeaderboard() {
    pendingLbScore = null;
    resetGame();
  }

  function pickDifficulty(key) {
    if (!DIFF[key]) return;
    currentDifficulty = key;
    difficultyChosen = true;
    pillDifficulty.hidden = false;
    diffLabel.textContent = DIFF_NAMES[key];
    resetGame();
  }

  function resetGame() {
    stopObstacleSpawner();
    particles = [];
    boostKey = false;
    boostPointer = false;
    swipePointerId = null;
    syncBoostUi();
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { ...dir };
    score = 0;
    paused = false;
    gameOver = false;
    food = emptyCell();
    scoreEl.textContent = "0";

    if (!difficultyChosen) {
      tickMs = DIFF.normal.start;
      running = false;
      showPageDifficulty();
      loadBest();
      syncPauseLabels();
      return;
    }

    const cfg = tickCfg();
    tickMs = cfg.start;
    running = true;
    hideOverlay();
    lastTick = performance.now();
    lastRafTime = performance.now();
    loadBest();
    sfxStart();
    syncPauseLabels();
    startObstacleSpawner();
  }

  function opposite(a, b) {
    return a.x === -b.x && a.y === -b.y;
  }

  function step() {
    if (!running || paused || gameOver) return;

    dir = { ...nextDir };
    const head = snake[0];
    const nh = { x: head.x + dir.x, y: head.y + dir.y };

    if (nh.x < 0 || nh.x >= COLS || nh.y < 0 || nh.y >= ROWS) {
      gameOver = true;
      openGameOver("撞墙");
      return;
    }

    if (blockedByObstacle(nh)) {
      gameOver = true;
      openGameOver("撞到障碍");
      return;
    }

    const eating = nh.x === food.x && nh.y === food.y;
    const bodyCheck = eating ? snake : snake.slice(0, -1);
    for (let i = 0; i < bodyCheck.length; i++) {
      if (bodyCheck[i].x === nh.x && bodyCheck[i].y === nh.y) {
        gameOver = true;
        openGameOver("咬到自己");
        return;
      }
    }

    snake.unshift(nh);

    if (eating) {
      const fcx = food.x * CELL + CELL * 0.5;
      const fcy = food.y * CELL + CELL * 0.5;
      spawnEatParticles(fcx, fcy);
      score += 10;
      scoreEl.textContent = String(score);
      food = emptyCell();
      const cfg = tickCfg();
      tickMs = Math.max(cfg.min, tickMs - cfg.step);
      sfxEat();
    } else {
      snake.pop();
    }
  }

  function drawBoard() {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--canvas-bg").trim() || "#0c0e14";
    const g = ctx.createRadialGradient(
      LOGICAL * 0.35,
      LOGICAL * 0.25,
      0,
      LOGICAL * 0.5,
      LOGICAL * 0.5,
      LOGICAL * 0.85
    );
    g.addColorStop(0, "rgba(167, 139, 250, 0.09)");
    g.addColorStop(0.45, bg);
    g.addColorStop(1, "#05060a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, LOGICAL, LOGICAL);

    const t0 = (x, y) => ((x + y) & 1) === 0;
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (t0(x, y)) {
          ctx.fillStyle = "rgba(255,255,255,0.018)";
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }

    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, LOGICAL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(LOGICAL, y * CELL + 0.5);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(255,255,255,0.14)";
    ctx.strokeRect(0.5, 0.5, LOGICAL - 1, LOGICAL - 1);
  }

  function roundCellRect(x, y, pad, rMul) {
    const px = x * CELL + pad;
    const py = y * CELL + pad;
    const s = CELL - pad * 2;
    const r = Math.min(CELL * 0.32, s * (rMul || 0.28));
    return { px, py, s, r };
  }

  function drawFixedObstacles() {
    for (const o of FIXED_OBSTACLES) {
      const { px, py, s, r } = roundCellRect(o.x, o.y, CELL * 0.12, 0.22);
      const grd = ctx.createLinearGradient(px, py, px + s, py + s);
      grd.addColorStop(0, "#4b5563");
      grd.addColorStop(1, "#1f2937");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.roundRect(px, py, s, s, r);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawTempObstacle() {
    if (!tempObstacleActive()) return;
    const o = tempObstacle;
    const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 220);
    const { px, py, s, r } = roundCellRect(o.x, o.y, CELL * 0.1, 0.26);
    const grd = ctx.createRadialGradient(px + s * 0.35, py + s * 0.35, 0, px + s * 0.5, py + s * 0.5, s * 0.75);
    grd.addColorStop(0, `rgba(251, 191, 36, ${0.55 * pulse})`);
    grd.addColorStop(0.6, `rgba(249, 115, 22, ${0.85 * pulse})`);
    grd.addColorStop(1, "rgba(185, 28, 28, 0.95)");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.roundRect(px, py, s, s, r);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.25;
    ctx.stroke();
  }

  function drawFood() {
    const { px, py, s, r } = roundCellRect(food.x, food.y, CELL * 0.14, 0.3);
    const breathe = 1 + 0.04 * Math.sin(performance.now() / 350);
    const cx = px + s / 2;
    const cy = py + s / 2;
    const rs = (s / 2) * breathe;
    ctx.save();
    ctx.shadowBlur = CELL * 0.55;
    ctx.shadowColor = "rgba(251, 113, 133, 0.75)";
    const rg = ctx.createRadialGradient(cx - rs * 0.25, cy - rs * 0.25, 0, cx, cy, rs * 1.2);
    rg.addColorStop(0, "#ffe4e6");
    rg.addColorStop(0.4, "#fb7185");
    rg.addColorStop(1, "#9f1239");
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.roundRect(px, py, s, s, r);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.15;
    ctx.stroke();
    ctx.restore();
  }

  function drawSnakeEyes(px, py, s, face) {
    const ex = s * 0.22;
    const ey = s * 0.28;
    const er = Math.max(1.8, s * 0.11);
    let ox = 0;
    let oy = 0;
    if (face.x === 1) ox = s * 0.12;
    if (face.x === -1) ox = -s * 0.12;
    if (face.y === 1) oy = s * 0.12;
    if (face.y === -1) oy = -s * 0.12;
    const bx = px + s * 0.5 + ox;
    const by = py + s * 0.42 + oy;
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath();
    ctx.arc(bx - ex, by, er, 0, Math.PI * 2);
    ctx.arc(bx + ex, by, er, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0f172a";
    const pup = s * 0.045;
    ctx.beginPath();
    ctx.arc(bx - ex + face.x * pup * 0.5, by + face.y * pup * 0.5, er * 0.45, 0, Math.PI * 2);
    ctx.arc(bx + ex + face.x * pup * 0.5, by + face.y * pup * 0.5, er * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    const face = nextDir.x || nextDir.y ? nextDir : dir;
    const n = snake.length;
    ctx.save();
    const glowLayers = [
      { blur: CELL * 0.95, col: "rgba(167, 139, 250, 0.28)" },
      { blur: CELL * 0.42, col: "rgba(52, 211, 153, 0.42)" },
    ];
    for (const gl of glowLayers) {
      ctx.shadowBlur = gl.blur;
      ctx.shadowColor = gl.col;
      for (let i = n - 1; i >= 0; i--) {
        const seg = snake[i];
        const isHead = i === 0;
        const pad = isHead ? CELL * 0.11 : CELL * 0.13;
        const { px, py, s, r } = roundCellRect(seg.x, seg.y, pad, isHead ? 0.3 : 0.26);
        const t = n <= 1 ? 0 : i / (n - 1);
        const lg = ctx.createLinearGradient(px - s * 0.15, py, px + s * 1.1, py + s * 1.05);
        lg.addColorStop(0, `rgba(196, 181, 253, ${0.45 + t * 0.35})`);
        lg.addColorStop(0.5, `rgba(45, 212, 191, ${0.4 + t * 0.38})`);
        lg.addColorStop(1, `rgba(244, 114, 182, ${0.35 + t * 0.4})`);
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.roundRect(px, py, s, s, r);
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
    for (let i = n - 1; i >= 0; i--) {
      const seg = snake[i];
      const isHead = i === 0;
      const pad = isHead ? CELL * 0.11 : CELL * 0.13;
      const { px, py, s, r } = roundCellRect(seg.x, seg.y, pad, isHead ? 0.3 : 0.26);
      const t = n <= 1 ? 0 : i / (n - 1);
      const lg = ctx.createLinearGradient(px - s * 0.25, py - s * 0.2, px + s * 1.05, py + s * 1.15);
      if (isHead) {
        lg.addColorStop(0, "#f5d0fe");
        lg.addColorStop(0.42, "#34d399");
        lg.addColorStop(1, "#059669");
      } else {
        lg.addColorStop(0, `rgba(167, 139, 250, ${0.82 - t * 0.28})`);
        lg.addColorStop(0.48, `rgba(52, 211, 153, ${0.55 + t * 0.32})`);
        lg.addColorStop(1, `rgba(244, 114, 182, ${0.62 - t * 0.18})`);
      }
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.roundRect(px, py, s, s, r);
      ctx.fill();
      ctx.strokeStyle = isHead ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.16)";
      ctx.lineWidth = isHead ? 1.65 : 1.05;
      ctx.stroke();
      if (isHead) drawSnakeEyes(px, py, s, face);
    }
    ctx.restore();
  }

  function draw() {
    drawBoard();
    drawFixedObstacles();
    drawTempObstacle();
    drawFood();
    drawSnake();
    drawParticles();
  }

  let lastRafTime = performance.now();

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(40, now - lastRafTime);
    lastRafTime = now;
    stepParticles(dt);
    syncBoostUi();

    if (!running) {
      draw();
      return;
    }
    if (gameOver) {
      draw();
      return;
    }
    if (paused) {
      draw();
      return;
    }
    if (tempObstacle && performance.now() >= tempObstacle.until) tempObstacle = null;
    let guard = 0;
    while (guard++ < 16) {
      const stepInt = tickMs * (isBoosting() ? BOOST_TICK_MUL : 1);
      if (now - lastTick < stepInt) break;
      lastTick += stepInt;
      step();
      if (gameOver) break;
    }
    draw();
  }

  function trySetDirection(nd) {
    if (!difficultyChosen || gameOver || !running) return;
    if (paused) return;
    if (!opposite(nd, dir)) nextDir = nd;
  }

  function togglePause() {
    if (!difficultyChosen || gameOver || !running) return;
    paused = !paused;
    if (paused) {
      notePauseForObstacles();
      boostKey = false;
      boostPointer = false;
      if (swipePointerId != null) {
        try {
          canvasWrap.releasePointerCapture(swipePointerId);
        } catch (_) {}
        swipePointerId = null;
      }
      syncBoostUi();
      sfxPause();
      showOverlay("已暂停", "点击继续、按 P / Esc，或使用工具栏与下方按钮");
    } else {
      resumeObstacleAfterPause();
      hideOverlay();
    }
    syncPauseLabels();
  }

  function onKeyUp(e) {
    const lk = e.key.toLowerCase();
    if (lk === " " || lk === "spacebar") {
      boostKey = false;
      syncBoostUi();
    }
  }

  function onKey(e) {
    const lk = e.key.toLowerCase();
    const map = {
      arrowup: { x: 0, y: -1 },
      arrowdown: { x: 0, y: 1 },
      arrowleft: { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 },
      w: { x: 0, y: -1 },
      s: { x: 0, y: 1 },
      a: { x: -1, y: 0 },
      d: { x: 1, y: 0 },
    };
    if (lk === " " || lk === "spacebar") {
      if (gameOver && document.activeElement === playerName) return;
      if (!difficultyChosen || gameOver || !running) return;
      if (e.repeat) return;
      e.preventDefault();
      boostKey = true;
      syncBoostUi();
      resumeAudio();
      return;
    }
    if (lk === "p" || e.key === "Escape") {
      if (gameOver && document.activeElement === playerName) return;
      e.preventDefault();
      if (gameOver) return;
      if (!difficultyChosen || !running) return;
      togglePause();
      return;
    }
    if (lk === "r") {
      e.preventDefault();
      resetGame();
      return;
    }
    const nd = map[lk] || map[e.key];
    if (!nd) return;
    e.preventDefault();
    trySetDirection(nd);
  }

  function bindDirButton(el, vec) {
    el.addEventListener(
      "pointerdown",
      (ev) => {
        if (ev.pointerType === "mouse" && ev.button !== 0) return;
        ev.preventDefault();
        resumeAudio();
        trySetDirection(vec);
      },
      { passive: false }
    );
  }

  btnRestart.addEventListener("click", () => resetGame());
  btnPause.addEventListener("click", () => {
    resumeAudio();
    togglePause();
  });
  btnOverlay.addEventListener("click", () => {
    paused = false;
    resumeObstacleAfterPause();
    hideOverlay();
    syncPauseLabels();
  });
  btnSound.addEventListener("click", () => {
    soundMuted = !soundMuted;
    localStorage.setItem(MUTE_KEY, soundMuted ? "1" : "0");
    syncSoundButton();
    if (!soundMuted) resumeAudio();
  });
  btnSaveLb.addEventListener("click", submitLeaderboard);
  btnSkipLb.addEventListener("click", skipLeaderboard);

  playerName.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      submitLeaderboard();
    }
  });

  document.querySelectorAll("[data-diff]").forEach((btn) => {
    btn.addEventListener("click", () => {
      resumeAudio();
      pickDifficulty(btn.getAttribute("data-diff"));
    });
  });

  bindDirButton(touchUp, { x: 0, y: -1 });
  bindDirButton(touchDown, { x: 0, y: 1 });
  bindDirButton(touchLeft, { x: -1, y: 0 });
  bindDirButton(touchRight, { x: 1, y: 0 });
  touchPause.addEventListener(
    "pointerdown",
    (ev) => {
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      ev.preventDefault();
      resumeAudio();
      togglePause();
    },
    { passive: false }
  );

  function onWrapPointerDown(ev) {
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    if (!difficultyChosen || gameOver || !running) return;
    resumeAudio();
    boostPointer = true;
    syncBoostUi();
    swipePointerId = ev.pointerId;
    swipeStartX = ev.clientX;
    swipeStartY = ev.clientY;
    try {
      canvasWrap.setPointerCapture(ev.pointerId);
    } catch (_) {}
  }

  function onWrapPointerMove(ev) {
    if (swipePointerId !== ev.pointerId) return;
    if (!running || paused || gameOver || !difficultyChosen) return;
    const dx = ev.clientX - swipeStartX;
    const dy = ev.clientY - swipeStartY;
    const dist = Math.hypot(dx, dy);
    if (dist < SWIPE_MIN_PX) return;
    if (Math.abs(dx) >= Math.abs(dy)) {
      trySetDirection({ x: dx > 0 ? 1 : -1, y: 0 });
    } else {
      trySetDirection({ x: 0, y: dy > 0 ? 1 : -1 });
    }
    swipeStartX = ev.clientX;
    swipeStartY = ev.clientY;
  }

  function onWrapPointerUp(ev) {
    if (swipePointerId != null && ev.pointerId !== swipePointerId) return;
    boostPointer = false;
    swipePointerId = null;
    syncBoostUi();
    try {
      canvasWrap.releasePointerCapture(ev.pointerId);
    } catch (_) {}
  }

  canvasWrap.addEventListener("pointerdown", onWrapPointerDown, { passive: false });
  canvasWrap.addEventListener("pointermove", onWrapPointerMove);
  canvasWrap.addEventListener("pointerup", onWrapPointerUp);
  canvasWrap.addEventListener("pointercancel", onWrapPointerUp);
  canvasWrap.addEventListener("lostpointercapture", onWrapPointerUp);

  window.addEventListener("blur", () => {
    boostKey = false;
    syncBoostUi();
  });
  window.addEventListener("keydown", onKey);
  window.addEventListener("keyup", onKeyUp);
  window.addEventListener("resize", () => {
    applyCanvasResolution();
    syncTouchHint();
  });
  if (typeof ResizeObserver !== "undefined") {
    const ro = new ResizeObserver(() => {
      applyCanvasResolution();
    });
    ro.observe(canvasWrap);
  }
  ["click", "touchstart"].forEach((ev) => {
    document.body.addEventListener(ev, () => resumeAudio(), { passive: true });
  });

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      this.moveTo(x + rr, y);
      this.arcTo(x + w, y, x + w, y + h, rr);
      this.arcTo(x + w, y + h, x, y + h, rr);
      this.arcTo(x, y + h, x, y, rr);
      this.arcTo(x, y, x + w, y, rr);
      this.closePath();
    };
  }

  syncSoundButton();
  renderLeaderboard();
  syncTouchHint();
  syncPauseLabels();
  resetGame();
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
